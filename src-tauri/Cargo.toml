[package]
name = "dpi_gui"
version = "26.11.3"
description = "DPI Bypass GUI"
authors = ["Sankyuubigan"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
# "unstable" — Window::add_child (embedded webview вкладки «Браузер», 08.11.26)
tauri = { version = "2.0.0", features = ["unstable"] }
tauri-plugin-shell = "2.0.0"
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "zip"] }
tauri-plugin-process = "2"
# Диалог выбора папки User Data — «Кукисы из папки…» (08.11.26)
tauri-plugin-dialog = "2"
# Единый конвейер логов (08.11.26): log::Log → exe-файл + событие logs:message
# для общей лог-области на всех вкладках; SSOT подключения — docs/README.md плагина.
tauri-plugin-logs = { path = "../../my-tauri-plugins/tauri-plugin-logs" }
log = "0.4"
# Модуль «О приложении / Обновления»: история релизов GitHub + откат (общий репозиторий my-tauri-plugins).
tauri-plugin-about-updates = { path = "../../my-tauri-plugins/tauri-plugin-about-updates" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["blocking"] }
headless_chrome = { version = "1.0", features = ["fetch"] }
sysinfo = "0.32"
dirs = "5.0"
shlex = "1.3"
url = "2.5"
trust-dns-resolver = { version = "0.23", features = ["dns-over-https-rustls"] }
windows-sys = { version = "0.52", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Threading", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock"] }
# QUIC-детектор (PRP 23.10.26): HKDF-SHA256 + AES-128-GCM/ECB для Initial (RFC 9001).
sha2 = "0.10"
hkdf = "0.12"
aes = "0.8"
aes-gcm = "0.10"
# Кукисы из браузера для честных проб (PRP 08.11.26): rookie 0.5.6 —
# Chrome/Edge/Firefox и др.; браузер выбирает юзер в UI.
rookie = "0.5.6"
# TLS-щуп (PRP 11.11.26): сертификат сервера при BadCert — reqwest не отдаёт
# сертификат при падении рукопожатия. native-tls уже в дереве (бэкенд reqwest).
native-tls = "0.2"
